name: publish

on:
  schedule:
    - cron: "0 3 * * *" # 06:00 Asia/Jerusalem in summer (IDT), 05:00 in winter
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  refresh:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --locked python -m refresh
      - name: Commit artifacts if changed
        run: |
          git config user.name "yesh-mischak bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/events.json site/bloomfield.ics
          git diff --cached --quiet || { git commit -m "data: refresh $(TZ=Asia/Jerusalem date +%F)"; git pull --rebase origin main && git push; }

  deploy:
    needs: [test, refresh]
    if: always() && github.event_name != 'pull_request' && needs.test.result == 'success' && needs.refresh.result != 'failure' && needs.refresh.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
